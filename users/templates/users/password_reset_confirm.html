{% extends 'mailing/base.html' %}

{% block title %}Установка нового пароля{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-olive">
                <div class="card-header" style="background: linear-gradient(135deg, #556B2F 0%, #6B8E23 100%); color: white;">
                    <h4 class="mb-0">Установка нового пароля</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted" style="color: #556B2F;">Введите новый пароль для вашей учетной записи.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="password1" class="form-label" style="color: #556B2F; font-weight: 500;">Новый пароль</label>
                            <input type="password" name="password1" id="password1" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label" style="color: #556B2F; font-weight: 500;">Подтверждение пароля</label>
                            <input type="password" name="password2" id="password2" class="form-control" required>
                        </div>
                        <button type="submit" class="btn w-100" style="background: linear-gradient(135deg, #556B2F 0%, #6B8E23 100%); color: white; border: none; padding: 10px;">
                            Установить пароль
                        </button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:login' %}" style="color: #6B8E23;">Вернуться ко входу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
